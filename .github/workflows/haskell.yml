name: Haskell CI

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Cache Nix store and cabal store
      uses: actions/cache@v6
      with:
        path: |
          /nix
          ~/.cabal/packages
          ~/.cabal/store
          ~/.local/state/cabal
          dist-newstyle
        key: nix-cabal-${{ runner.os }}-${{ hashFiles('flake.lock', 'mqttd.cabal') }}
        restore-keys: nix-cabal-${{ runner.os }}-

    - name: Build & Test
      run: |
        nix develop --command cabal update
        nix develop --command cabal build all
        nix develop --command cabal test --test-show-details=streaming
        mkdir dist
        cp $(nix develop --command cabal list-bin exe:mqttd) dist
        cp $(nix develop --command cabal list-bin exe:mqttdpass) dist

    - name: Store Artifact
      uses: actions/upload-artifact@v7
      with:
        name: mqttd-ubuntu-latest
        path: dist

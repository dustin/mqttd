name: Docker Build

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        platforms: linux/amd64
        tags: ${{ secrets.DOCKER_USERNAME }}/mqttd:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mqttd:cache
        cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}/mqttd:cache,mode=max', secrets.DOCKER_USERNAME) || '' }}
